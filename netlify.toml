# XA Project PhotoLog — Netlify configuration. Static hosting only; all
# data/business logic goes through the shared XA DOS Supabase project.
[build]
  command = "npm run build"
  publish = "dist"

# React Router client-side routing — without this, refreshing on /dashboard
# etc. would 404 on Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
