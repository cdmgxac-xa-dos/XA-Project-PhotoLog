# XA Project PhotoLog — Netlify configuration. Static hosting only; all
# data/business logic goes through the shared XA DOS Supabase project.
[build]
  command = "npm run build"
  publish = "dist"

# Netlify doesn't know the .webmanifest extension by default and serves it
# as application/octet-stream, which some browsers refuse to treat as an
# installable app manifest (relevant since this app is meant to be added
# to a phone home screen).
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# React Router client-side routing — without this, refreshing on /dashboard
# etc. would 404 on Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
